version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      compatible-dependencies:
        update-types: [minor, patch]
    commit-message:
      prefix: 'deps'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      action-updates:
        patterns: ['*']
    commit-message:
      prefix: 'ci'
