name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  quality:
    name: Types, formatting, workflows and audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint:actions
      - run: npm run check
      - run: npm audit --audit-level=high

  unit:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - if: matrix.node == '22'
        run: npm test
      - if: matrix.node == '24'
        run: npm run test:coverage -- --reporter=default --reporter=junit --outputFile.junit=artifacts/unit.xml
      - if: always() && matrix.node == '24'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-coverage-${{ github.sha }}
          path: |
            coverage/
            artifacts/unit.xml
          retention-days: 14
          if-no-files-found: warn

  build:
    name: Production Worker and SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:client
      - run: npm run package:worker
      - run: npm run verify:worker
        env:
          PCL_EXPECTED_SHA: ${{ github.sha }}
      - run: npm sbom --sbom-format cyclonedx --omit=dev > artifacts/sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-${{ github.sha }}
          path: |
            artifacts/worker.tar.gz
            artifacts/worker-manifest.json
            artifacts/SHA256SUMS
            artifacts/sbom.cdx.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  browser:
    name: Browser (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            projects: --project=desktop --project=mobile
          - browser: firefox
            projects: --project=firefox
          - browser: webkit
            projects: --project=webkit
    env:
      PCL_CROSS_BROWSER: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps "$BROWSER"
        env:
          BROWSER: ${{ matrix.browser }}
      - run: |
          read -r -a projects <<< "$PROJECTS"
          npx playwright test "${projects[@]}"
        env:
          PROJECTS: ${{ matrix.projects }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-${{ matrix.browser }}-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
            artifacts/e2e.xml
          retention-days: 14
          if-no-files-found: warn

  worker:
    name: Production runtime and browser workflow
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: worker-${{ github.sha }}
          path: artifacts
      - run: npm run verify:worker
        env:
          PCL_EXPECTED_SHA: ${{ github.sha }}
      - run: mkdir -p .svelte-kit/cloudflare && tar -xzf artifacts/worker.tar.gz -C .svelte-kit/cloudflare
      - run: npx playwright install --with-deps chromium
      - run: npm run test:worker
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-browser-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
            artifacts/e2e.xml
            artifacts/worker.log
          retention-days: 14
          if-no-files-found: warn

  required:
    name: Required checks
    if: always()
    needs: [quality, unit, build, browser, worker]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every validation job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys
          jobs = json.loads(os.environ['RESULTS'])
          rows = ['| Check | Result |', '| --- | --- |']
          rows += [f'| {name} | {job["result"]} |' for name, job in jobs.items()]
          pathlib.Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(rows) + '\n')
          sys.exit(0 if all(job['result'] == 'success' for job in jobs.values()) else 1)
          PY
